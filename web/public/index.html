<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>QR Doorbell</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    /* Estilos específicos del timbre/chat */
    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
      margin-top: 18px;
      text-align: left;
    }

    .title-block {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .title-chip-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    #title {
      margin: 0;
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      color: #e5e7eb;
    }

    .badge-role {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(15,23,42,0.82);
      border: 1px solid rgba(148, 163, 184, 0.5);
      font-size: 11px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .badge-dot {
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: var(--accent);
      box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.45);
    }

    .btn-corner {
      position: absolute;
      top: 10px;
      left: 10px;
      border: 1px solid rgba(148, 163, 184, 0.6);
      border-style: solid;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.95);
      color: var(--text);
      box-shadow: var(--shadow-pill);
    }

    .btn-corner:hover {
      border-color: var(--accent);
      background: rgba(34, 197, 94, 0.1);
    }

    .btn-ghost.btn-corner {
      border-style: solid;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 14px;
      border-radius: var(--radius-md);
      background: linear-gradient(135deg, rgba(15,23,42,0.98), rgba(15,23,42,0.9));
      border: 1px solid rgba(148, 163, 184, 0.6);
      box-shadow: var(--shadow-pill);
      font-size: 0.78rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      white-space: nowrap;
    }

    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 999px;
      background: radial-gradient(circle at 30% 30%, #bbf7d0, var(--accent));
      box-shadow: 0 0 0 5px rgba(34, 197, 94, 0.45);
    }

    .status-text-main {
      font-weight: 600;
      color: #e5e7eb;
    }

    .info-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
      font-size: 0.82rem;
      color: var(--muted);
    }

    .info-row span.code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      padding: 3px 8px;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.6);
      background: rgba(15, 23, 42, 0.96);
      color: #e5e7eb;
    }

    .messages-shell {
      position: relative;
      border-radius: var(--radius-lg);
      background: radial-gradient(circle at top, rgba(15,23,42,0.95), rgba(15,23,42,0.98));
      border: 1px solid rgba(148, 163, 184, 0.6);
      padding: 12px 0 10px;
      margin-bottom: 8px;
      overflow: hidden;
    }

    .messages-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px 4px;
      font-size: 0.82rem;
      color: var(--muted);
    }

    .messages-header span.label {
      font-weight: 500;
      color: #d1d5db;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .pill-counter {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 9px;
      border-radius: 999px;
      background: rgba(15,23,42,0.96);
      border: 1px solid rgba(148, 163, 184, 0.7);
      font-size: 0.78rem;
      color: var(--muted);
    }

    .pill-counter-dot {
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: #38bdf8;
    }

    #messages {
      max-height: 260px;
      min-height: 140px;
      overflow-y: auto;
      padding: 4px 14px 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      scrollbar-width: thin;
      scrollbar-color: rgba(148, 163, 184, 0.9) transparent;
      font-size: 0.9rem;
    }

    #messages::-webkit-scrollbar {
      width: 6px;
    }
    #messages::-webkit-scrollbar-track {
      background: transparent;
    }
    #messages::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.75);
      border-radius: 999px;
    }

    .msg {
      display: inline-flex;
      align-items: flex-start;
      gap: 8px;
      max-width: 88%;
      padding: 8px 12px;
      border-radius: 14px;
      border: 1px solid rgba(148, 163, 184, 0.6);
      background: rgba(15, 23, 42, 0.95);
      box-shadow: 0 10px 28px rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(10px);
      animation: fadeInUp 0.18s ease-out;
      word-break: break-word;
    }

    .msg.me {
      margin-left: auto;
      background: radial-gradient(circle at top, rgba(34,197,94,0.12), rgba(15,23,42,0.98));
      border-color: rgba(74, 222, 128, 0.7);
    }

    .msg-icon {
      font-size: 0.9rem;
      flex-shrink: 0;
      margin-top: 1px;
    }

    .msg-text {
      color: #e5e7eb;
    }

    .msg-meta {
      margin-top: 3px;
      font-size: 0.72rem;
      color: var(--muted);
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(4px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .input-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 8px;
    }

    .input-shell {
      position: relative;
      flex: 1;
    }

    #text {
      width: 100%;
      padding: 10px 12px 10px 12px;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.7);
      background: rgba(15, 23, 42, 0.98);
      color: var(--text);
      font-size: 0.9rem;
      outline: none;
      box-shadow: inset 0 0 0 1px rgba(15, 23, 42, 0.9);
    }

    #text::placeholder {
      color: rgba(148, 163, 184, 0.85);
    }

    #text:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px rgba(34, 197, 94, 0.9), 0 0 0 5px rgba(34, 197, 94, 0.25);
    }

    #send {
      border: none;
      border-radius: 999px;
      padding: 10px 15px;
      min-width: 84px;
      font-size: 0.86rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      cursor: pointer;
      background: linear-gradient(135deg, #22c55e, #4ade80);
      color: #022c22;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 14px 35px rgba(22, 163, 74, 0.65);
      transition: transform 0.08s ease-out, box-shadow 0.08s ease-out, filter 0.08s ease-out;
      white-space: nowrap;
    }

    #send:disabled {
      opacity: 0.4;
      cursor: default;
      box-shadow: none;
    }

    #send:not(:disabled):hover {
      transform: translateY(-1px);
      filter: brightness(1.03);
      box-shadow: 0 17px 40px rgba(22, 163, 74, 0.7);
    }

    #send:not(:disabled):active {
      transform: translateY(0);
      box-shadow: 0 10px 26px rgba(22, 163, 74, 0.7);
    }


    .actions-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 10px;
    }

    .actions-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .hint-text {
      font-size: 0.78rem;
      color: var(--muted);
      margin-top: 6px;
    }

    .hint-text.error {
      color: var(--danger);
    }

    .panel {
      background: linear-gradient(145deg, rgba(15,23,42,0.96), rgba(15,23,42,0.9));
      border-radius: 22px;
      padding: 18px 18px 16px;
      border: 1px solid rgba(148, 163, 184, 0.6);
      box-shadow: var(--shadow-soft);
      position: relative;
      overflow: hidden;
    }

    .panel::before {
      content: "";
      position: absolute;
      inset: -60%;
      background:
        radial-gradient(circle at 0 0, rgba(56, 189, 248, 0.05), transparent 48%),
        radial-gradient(circle at 100% 0, rgba(168, 85, 247, 0.1), transparent 45%);
      opacity: 0.85;
      pointer-events: none;
    }

    .panel-inner {
      position: relative;
      z-index: 1;
    }

    .panel-title {
      margin: 0 0 8px;
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #e5e7eb;
    }

    .panel-subtitle {
      margin: 0 0 10px;
      font-size: 0.82rem;
      color: var(--muted);
    }

    .panel-steps {
      list-style: none;
      padding: 0;
      margin: 8px 0 10px;
      font-size: 0.8rem;
      color: var(--muted);
    }

    .panel-steps li {
      display: flex;
      gap: 8px;
      margin-bottom: 7px;
    }

    .step-badge {
      width: 18px;
      height: 18px;
      border-radius: 999px;
      background: rgba(15,23,42,0.98);
      border: 1px solid rgba(148, 163, 184, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      color: #e5e7eb;
      flex-shrink: 0;
      box-shadow: 0 8px 18px rgba(15, 23, 42, 0.9);
    }

    .step-text strong {
      color: #e5e7eb;
      font-weight: 500;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.7);
      font-size: 0.78rem;
      color: var(--muted);
      background: rgba(15, 23, 42, 0.96);
      margin-top: 2px;
    }

    .pill-dot {
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: #4ade80;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 10px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.96);
      border: 1px solid rgba(148, 163, 184, 0.7);
      font-size: 0.78rem;
      color: var(--muted);
    }

    .tag-dot {
      width: 5px;
      height: 5px;
      border-radius: 999px;
      background: #38bdf8;
    }
  </style>
</head>
<body>
  <div class="shell">
    <main class="card">
      <div class="card-inner">
        <header class="header">
          <div class="title-block">
            <div class="title-chip-row">
              <h2 id="title">QR Doorbell</h2>
              <span class="badge-role" id="role-badge">
                <span class="badge-dot"></span>
                <span id="role-label">Visitante</span>
              </span>
            </div>
          </div>
          <div class="status-pill" id="status-pill">
            <span class="status-dot"></span>
            <span class="status-text-main" id="status-main">Conectado al servidor</span>
          </div>
        </header>

        <div class="info-row">
          <span id="unit-info">
            <span id="unit-label">Departamento: —</span>
          </span>
          <span id="session-indicator" class="code" style="opacity:0.7; display:none;">sesión activa</span>
        </div>

        <section class="messages-shell">
          <div class="messages-header">
            <span class="label">
              Conversación
            </span>
            <span class="pill-counter">
              <span class="pill-counter-dot"></span>
              <span id="message-count">0 mensajes</span>
            </span>
          </div>
          <div id="messages"></div>
        </section>

        <div class="input-row">
          <div class="input-shell">
            <input id="text" placeholder="Escribí un mensaje…" autocomplete="off" />
          </div>
          <button id="send">
            <span class="btn-icon">➤</span>
            <span>Enviar</span>
          </button>
        </div>

        <div class="actions-row">
          <div class="actions-group">
            <button id="back-to-units" class="btn btn-ghost btn-sm" style="display:none;">
              <span class="btn-icon">↩</span>
              <span>Cambiar depto</span>
            </button>
            <button id="start" class="btn btn-ghost btn-sm">
              <span class="btn-icon">🔔</span>
              <span>Tocar timbre</span>
            </button>
            <button id="close" class="btn btn-danger btn-sm" style="display:none;">
              <span class="btn-icon">🔒</span>
              <span>Cerrar</span>
            </button>
          </div>
          <span class="tag" id="ws-status">
            <span class="tag-dot"></span>
            Conectado
          </span>
        </div>

        <p class="hint-text" id="hint-text">
          Seleccioná el departamento y tocá el timbre para comenzar a chatear.
        </p>
      </div>
    </main>

  </div>

  <script src="app.js"></script>
</body>
</html>
