<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Iniciar sesión - QR Doorbell</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .shell { width: 100%; max-width: 420px; }
    .card {
      padding: 28px 24px;
    }
    .btn {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="card">
      <div class="header">
        <h1>🔐 Iniciar sesión</h1>
        <p>Accedé con tu email y contraseña</p>
      </div>
      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required autocomplete="email" placeholder="tu@email.com" />
        </div>
        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="••••••••" />
        </div>
        <button type="submit" class="btn" id="submitBtn">Entrar</button>
      </form>
      <p class="error-msg" id="error"></p>
      <div class="links">
        <a href="index.html">Volver al timbre</a>
      </div>
    </div>
  </div>
  <script>
    const form = document.getElementById('loginForm');
    const submitBtn = document.getElementById('submitBtn');
    const errorEl = document.getElementById('error');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.textContent = '';
      submitBtn.disabled = true;
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      try {
        const res = await fetch('/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ email, password })
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          errorEl.textContent = data.error || data.message || 'Email o contraseña incorrectos';
          submitBtn.disabled = false;
          return;
        }
        if (data.is_admin) {
          window.location.href = 'admin.html';
        } else {
          window.location.href = 'index.html';
        }
      } catch (err) {
        errorEl.textContent = 'Error de conexión. Intentá de nuevo.';
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
