<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Cambiar contraseña - QR Doorbell</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .shell { width: 100%; max-width: 420px; }
    .card {
      padding: 28px 24px;
    }
    .btn {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="card">
      <div class="header">
        <h1>🔑 Cambiar contraseña</h1>
        <p>Recomendamos cambiar la contraseña la primera vez que entres</p>
      </div>
      <form id="changeForm">
        <div class="form-group">
          <label for="current">Contraseña actual</label>
          <input type="password" id="current" name="current_password" required placeholder="••••••••" />
        </div>
        <div class="form-group">
          <label for="new">Nueva contraseña (mín. 6 caracteres)</label>
          <input type="password" id="new" name="new_password" required minlength="6" placeholder="••••••••" />
        </div>
        <div class="form-group">
          <label for="confirm">Repetir nueva contraseña</label>
          <input type="password" id="confirm" name="new_password_confirm" required minlength="6" placeholder="••••••••" />
        </div>
        <button type="submit" class="btn" id="submitBtn">Cambiar contraseña</button>
      </form>
      <p class="error-msg" id="error"></p>
      <p class="success-msg" id="success"></p>
      <div class="links">
        <a href="admin.html">Panel admin</a> · <a href="index.html">Timbre</a> · <a href="login.html">Salir</a>
      </div>
    </div>
  </div>
  <script>
    const form = document.getElementById('changeForm');
    const submitBtn = document.getElementById('submitBtn');
    const errorEl = document.getElementById('error');
    const successEl = document.getElementById('success');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.textContent = '';
      successEl.textContent = '';
      const newPass = document.getElementById('new').value;
      const confirmPass = document.getElementById('confirm').value;
      if (newPass !== confirmPass) {
        errorEl.textContent = 'La nueva contraseña y la repetición no coinciden.';
        return;
      }
      submitBtn.disabled = true;
      try {
        const res = await fetch('/auth/change-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({
            current_password: document.getElementById('current').value,
            new_password: newPass
          })
        });
        if (!res.ok) {
          const text = await res.text();
          errorEl.textContent = text || 'Error al cambiar la contraseña';
          submitBtn.disabled = false;
          return;
        }
        successEl.textContent = 'Contraseña actualizada. Podés cerrar esta página o volver al panel.';
        form.reset();
        submitBtn.disabled = false;
      } catch (err) {
        errorEl.textContent = 'Error de conexión.';
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
